name: Foundation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: examples/tutorial-requirements.txt
      - run: python -m pip install -r examples/tutorial-requirements.txt
      - run: npm ci
      - run: npm run check
      - run: npm run lesson:01
      # Public stage-01 practice is separate: homework starts unimplemented.
