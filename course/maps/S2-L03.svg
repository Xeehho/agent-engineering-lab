<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S2-L03 副作用、幂等与提示注入</title><desc id="diagram-description">副作用: 发送、扣款、删除会改变状态；只读与写入分开授权。确认: 批准具体操作与具体内容；文档命令不能取得执行权。幂等: 同一业务操作保持同一编号；完成回执应持久保存。不确定: 发送后断电不能盲目重发；查询回执或交人工核对</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S2-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">重试怎样避免重复改变世界？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 副作用</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 发送、扣款、删除会改变状态</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 只读与写入分开授权</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 确认</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 批准具体操作与具体内容</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 文档命令不能取得执行权</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 幂等</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 同一业务操作保持同一编号</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 完成回执应持久保存</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 不确定</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 发送后断电不能盲目重发</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 查询回执或交人工核对</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>