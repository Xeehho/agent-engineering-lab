<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S2-L01 工具调用：模型提议，应用执行</title><desc id="diagram-description">提议: 工具名称和参数是数据；不执行模型给出的任意代码。检查: 白名单、参数、身份授权；返回结果也有契约。执行: 应用调用注册的业务函数；记录实际结果与调用编号。证据: 未知工具和非法参数拒绝；本地夹具不证明真实数据库</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S2-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">模型怎样提议，应用怎样执行？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 提议</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 工具名称和参数是数据</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 不执行模型给出的任意代码</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 检查</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 白名单、参数、身份授权</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 返回结果也有契约</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 执行</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 应用调用注册的业务函数</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 记录实际结果与调用编号</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 证据</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 未知工具和非法参数拒绝</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 本地夹具不证明真实数据库</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>