<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S8-L01 毕业项目：从需求到验收</title><desc id="diagram-description">范围: 用户、任务、允许与禁止操作；先做一条可用纵向路径。架构: 界面、任务、模型、资料、工具；持久状态与评测横向支撑。验收: 正常、失败、越权、恢复；每条需求指向复现证据。掌握: AI协助如实说明；能解释修改与陌生故障</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S8-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">怎样把所有知识做成可验收产品？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 范围</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 用户、任务、允许与禁止操作</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 先做一条可用纵向路径</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 架构</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 界面、任务、模型、资料、工具</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 持久状态与评测横向支撑</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 验收</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 正常、失败、越权、恢复</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 每条需求指向复现证据</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 掌握</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• AI协助如实说明</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 能解释修改与陌生故障</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>