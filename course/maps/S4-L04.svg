<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S4-L04 SQL、索引与事务：存储工程基础</title><desc id="diagram-description">表与约束: 列、类型、唯一键约定数据；索引服务于具体查询。并发: 把版本条件放进更新语句；检查实际修改行数。事务: 数据库内多步一起提交；隔离语义取决于数据库。边界: 真实连接和竞争另行验证；事务不能自动覆盖外部API</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S4-L04</tspan></text><text x="350" y="305"><tspan x="350" dy="0">两个人同时保存，谁能覆盖谁？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 表与约束</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 列、类型、唯一键约定数据</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 索引服务于具体查询</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 并发</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 把版本条件放进更新语句</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 检查实际修改行数</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 事务</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 数据库内多步一起提交</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 隔离语义取决于数据库</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 边界</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 真实连接和竞争另行验证</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 事务不能自动覆盖外部API</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>