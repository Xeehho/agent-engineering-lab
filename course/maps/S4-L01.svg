<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S4-L01 任务状态与持久化</title><desc id="diagram-description">身份: request、task、attempt分开；重试有新尝试但仍是原任务。状态: 只允许明确的状态变化；终态不能被晚到消息覆盖。存储: 记录写入持久数据库；内存和页面状态不能代替。恢复: 查询版本与恢复入口；真实重启需单独验证</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S4-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">刷新和重启后，任务还在哪里？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 身份</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• request、task、attempt分开</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 重试有新尝试但仍是原任务</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 状态</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 只允许明确的状态变化</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 终态不能被晚到消息覆盖</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 存储</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 记录写入持久数据库</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 内存和页面状态不能代替</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 恢复</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 查询版本与恢复入口</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 真实重启需单独验证</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>