<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S1-L02 超时与取消：请求结束了吗？</title><desc id="diagram-description">时间: 超时是到点不再等待；总期限覆盖每次下游操作。协作: AbortController发通知；执行方观察signal并清理。竞态: 已取消、执行中、刚完成；晚到返回不能重开终态。证据: 检查调用次数与资源释放；停止等待不证明远端未计费</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S1-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">取消后，谁真的停止了？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 时间</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 超时是到点不再等待</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 总期限覆盖每次下游操作</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 协作</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• AbortController发通知</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 执行方观察signal并清理</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 竞态</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 已取消、执行中、刚完成</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 晚到返回不能重开终态</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 证据</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 检查调用次数与资源释放</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 停止等待不证明远端未计费</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>