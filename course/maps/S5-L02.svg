<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S5-L02 Embedding、向量与混合检索</title><desc id="diagram-description">关键词: 精确编号与词语有优势；基线先跑再谈模型替换。向量: embedding把文字映射为数字；相似度不等于正确概率。混合: 组合不同候选与排名；原始分数尺度不可随意相加。版本: 模型、维度、度量需配套；真实召回用标注集比较</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S5-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">不同措辞怎样找到相关资料？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 关键词</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 精确编号与词语有优势</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 基线先跑再谈模型替换</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 向量</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• embedding把文字映射为数字</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 相似度不等于正确概率</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 混合</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 组合不同候选与排名</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 原始分数尺度不可随意相加</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 版本</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 模型、维度、度量需配套</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 真实召回用标注集比较</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>