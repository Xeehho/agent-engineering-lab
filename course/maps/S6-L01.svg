<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S6-L01 路由与分工：先证明需要多 Agent</title><desc id="diagram-description">基线: 先用函数或固定流程；动态决定时才引入Agent。分工: 每个角色有输入输出契约；多个函数不自动是多Agent。权限: 每个角色只拿需要的能力；执行仍过统一检查。取舍: 同集证明质量收益；计算协作额外费用与延迟</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S6-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">增加角色能解决哪个实际问题？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 基线</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 先用函数或固定流程</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 动态决定时才引入Agent</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 分工</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 每个角色有输入输出契约</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 多个函数不自动是多Agent</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 权限</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 每个角色只拿需要的能力</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 执行仍过统一检查</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 取舍</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 同集证明质量收益</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 计算协作额外费用与延迟</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>