<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S1-L06 Python 后端桥接：读懂服务边界</title><desc id="diagram-description">入口: HTTP方法和路径找到路由；验证请求体并取得可信身份。业务: 函数负责处理有效输入；async不自动消除阻塞计算。出口: 结果按契约映射响应；错误分类避免假成功。验证: 网页看边界与数据流；Python进程与真实HTTP选做</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S1-L06</tspan></text><text x="350" y="305"><tspan x="350" dy="0">前端请求怎样穿过Python后端？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 入口</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• HTTP方法和路径找到路由</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 验证请求体并取得可信身份</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 业务</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 函数负责处理有效输入</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• async不自动消除阻塞计算</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 出口</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 结果按契约映射响应</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 错误分类避免假成功</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 验证</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 网页看边界与数据流</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• Python进程与真实HTTP选做</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>