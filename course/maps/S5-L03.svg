<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S5-L03 重排、引用与拒答</title><desc id="diagram-description">重排: 先召回再排序候选；高分不能替代事实判断。主张: 答案拆成可核验结论；逐条连接来源与版本。不足: 无答案、过期、冲突分开；选择追问、拒答或更新资料。评测: 引用存在与支持关系分开；语义裁判需要人工校准</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S5-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">这条主张真的被引用支持吗？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 重排</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 先召回再排序候选</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 高分不能替代事实判断</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 主张</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 答案拆成可核验结论</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 逐条连接来源与版本</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 不足</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 无答案、过期、冲突分开</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 选择追问、拒答或更新资料</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 评测</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 引用存在与支持关系分开</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 语义裁判需要人工校准</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>