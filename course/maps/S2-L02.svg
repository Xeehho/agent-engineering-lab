<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S2-L02 有限 Agent 循环与预算</title><desc id="diagram-description">起点: 任务需要看中间结果；工具就是应用提供的函数。循环: 决定、执行、记录、再决定；final结束，tools只是提议。字段: history保存实际工具结果；内部约定由适配器转换。控制: 轮次、工具数和期限分别限；挂起操作需要取消配合</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S2-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">为什么查过资料后还要再决定？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 起点</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 任务需要看中间结果</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 工具就是应用提供的函数</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 循环</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 决定、执行、记录、再决定</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• final结束，tools只是提议</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 字段</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• history保存实际工具结果</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 内部约定由适配器转换</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 控制</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 轮次、工具数和期限分别限</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 挂起操作需要取消配合</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>