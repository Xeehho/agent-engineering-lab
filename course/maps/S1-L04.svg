<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S1-L04 验证证据与第一阶段交卷</title><desc id="diagram-description">主张: 把可靠拆成具体行为；先写预期再运行。范围: Mock使检查可重复；真实接通与效果分别验证。复现: 固定版本、输入和步骤；保留失败与最小修复。交卷: 记录AI协助与未验证项；公开自测不等于正式通过</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S1-L04</tspan></text><text x="350" y="305"><tspan x="350" dy="0">这个结论由什么证据支持？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 主张</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 把可靠拆成具体行为</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 先写预期再运行</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 范围</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• Mock使检查可重复</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 真实接通与效果分别验证</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 复现</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 固定版本、输入和步骤</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 保留失败与最小修复</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 交卷</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 记录AI协助与未验证项</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 公开自测不等于正式通过</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>