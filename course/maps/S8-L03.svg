<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S8-L03 作品集、简历与求职演练</title><desc id="diagram-description">叙述: 具体问题、判断、机制和取舍；避免只堆术语。证据: 源码、复现、失败复盘相连；标明受控真实与未验证。公开: 密钥个人与第三方资料清理；署名许可范围说清楚。求职: 重查真实岗位与能力差距；课程记录不保证薪资或录用</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S8-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">怎样让能力陈述经得起追问？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 叙述</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 具体问题、判断、机制和取舍</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 避免只堆术语</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 证据</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 源码、复现、失败复盘相连</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 标明受控真实与未验证</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 公开</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 密钥个人与第三方资料清理</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 署名许可范围说清楚</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 求职</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 重查真实岗位与能力差距</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 课程记录不保证薪资或录用</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>