<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S1-L03 流式事件与 React 状态</title><desc id="diagram-description">传输: 网络字节不等于完整事件；按协议解码、缓存与分帧。关联: requestId区分请求；序号区分同一请求的先后。状态: reducer返回下一份状态；终态拒绝旧增量与重复事件。验证: 旧请求、重复、结束后晚到；真实拆包与重连另行验证</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S1-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">流式回答怎样不串请求？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 传输</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 网络字节不等于完整事件</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 按协议解码、缓存与分帧</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 关联</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• requestId区分请求</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 序号区分同一请求的先后</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 状态</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• reducer返回下一份状态</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 终态拒绝旧增量与重复事件</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 验证</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 旧请求、重复、结束后晚到</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 真实拆包与重连另行验证</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>