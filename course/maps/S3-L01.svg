<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S3-L01 MCP 的边界：Host、Client、Server</title><desc id="diagram-description">角色: Host管理用户与模型任务；Client连接Server能力。价值: 按共同协议发现和调用；同进程函数可先保持简单。责任: Server提供能力不等于Agent；协议不代替业务授权。版本: 按锁定SDK核对协议修订；网页角色模拟不算真实互通</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S3-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">MCP把哪两个边界连起来？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 角色</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• Host管理用户与模型任务</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• Client连接Server能力</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 价值</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 按共同协议发现和调用</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 同进程函数可先保持简单</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 责任</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• Server提供能力不等于Agent</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 协议不代替业务授权</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 版本</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 按锁定SDK核对协议修订</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 网页角色模拟不算真实互通</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>