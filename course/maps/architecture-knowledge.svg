<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="architecture-knowledge-title architecture-knowledge-description"><title id="architecture-knowledge-title">知识管道：从原文到可核验引用</title><desc id="architecture-knowledge-description">intake → lineage：保留来源；lineage → index：版本化片段；index → retrieval：词/向量候选；retrieval → evidence：权限过滤与重排；evidence → context：来源与未解决项；context → model：有限证据上下文；model → citation：候选主张；lifecycle → index：更新/撤权/删除；lifecycle → evidence：清理旧片段与缓存</desc><style>text{font:18px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><defs><marker id="arrow-knowledge" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" style="stroke:#7b9987;fill:#7b9987"/></marker></defs><path marker-end="url(#arrow-knowledge)" d="M290 75 L440 75"/><text x="365" y="69" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">保留来源</tspan></text><path marker-end="url(#arrow-knowledge)" d="M700 75 L850 75"/><text x="775" y="69" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">版本化片段</tspan></text><path marker-end="url(#arrow-knowledge)" d="M980 115 L980 245"/><text x="980" y="174" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="980" dy="0">词/向量候选</tspan></text><path marker-end="url(#arrow-knowledge)" d="M850 285 L700 285"/><text x="775" y="279" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">权限过滤与重排</tspan></text><path marker-end="url(#arrow-knowledge)" d="M440 285 L290 285"/><text x="365" y="279" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">来源与未解决项</tspan></text><path marker-end="url(#arrow-knowledge)" d="M160 325 L160 455"/><text x="160" y="384" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="160" dy="0">有限证据上下文</tspan></text><path marker-end="url(#arrow-knowledge)" d="M290 495 L440 495"/><text x="365" y="489" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">候选主张</tspan></text><path marker-end="url(#arrow-knowledge)" d="M980 455 L980 115"/><text x="980" y="279" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="980" dy="0">更新/撤权/删除</tspan></text><path marker-end="url(#arrow-knowledge)" d="M850 495 L700 285"/><text x="775" y="384" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">清理旧片段与缓存</tspan></text><g data-graph-node="intake"><rect x="30" y="35" width="260" height="80"/><text x="45" y="67"><tspan x="45" dy="0">知识采集与解析</tspan></text></g><g data-graph-node="lineage"><rect x="440" y="35" width="260" height="80"/><text x="455" y="67"><tspan x="455" dy="0">切分、权限与血缘</tspan></text></g><g data-graph-node="index"><rect x="850" y="35" width="260" height="80"/><text x="865" y="67"><tspan x="865" dy="0">索引与版本</tspan></text></g><g data-graph-node="retrieval"><rect x="850" y="245" width="260" height="80"/><text x="865" y="277"><tspan x="865" dy="0">有权限的检索与重排</tspan></text></g><g data-graph-node="evidence"><rect x="440" y="245" width="260" height="80"/><text x="455" y="277"><tspan x="455" dy="0">证据包</tspan></text></g><g data-graph-node="context"><rect x="30" y="245" width="260" height="80"/><text x="45" y="277"><tspan x="45" dy="0">上下文组装</tspan></text></g><g data-graph-node="model"><rect x="30" y="455" width="260" height="80"/><text x="45" y="487"><tspan x="45" dy="0">模型适配器</tspan></text></g><g data-graph-node="citation"><rect x="440" y="455" width="260" height="80"/><text x="455" y="487"><tspan x="455" dy="0">引用与拒答检查</tspan></text></g><g data-graph-node="lifecycle"><rect x="850" y="455" width="260" height="80"/><text x="865" y="487"><tspan x="865" dy="0">更新、删除与缓存失效</tspan></text></g></svg>