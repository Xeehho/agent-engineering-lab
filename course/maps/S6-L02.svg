<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S6-L02 交接、证据包与冲突处理</title><desc id="diagram-description">证据包: 任务、事实、来源与版本；记录未解决项和副作用状态。接收: 结构、权限、时效分别检查；摘要不是隐藏思考过程。冲突: 追问、重查或交给人；不靠角色互相说服到无限。预算: 总轮次、期限和费用有上限；失败交接可追踪可回退</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S6-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">交给下一位时，哪些信息不能丢？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 证据包</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 任务、事实、来源与版本</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 记录未解决项和副作用状态</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 接收</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 结构、权限、时效分别检查</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 摘要不是隐藏思考过程</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 冲突</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 追问、重查或交给人</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 不靠角色互相说服到无限</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 预算</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 总轮次、期限和费用有上限</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 失败交接可追踪可回退</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>