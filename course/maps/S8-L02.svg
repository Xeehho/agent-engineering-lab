<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S8-L02 系统设计与陌生故障答辩</title><desc id="diagram-description">定位: 固定任务版本并画时间线；缺失事件不随意补成成功。假设: 提出可证伪的不同解释；设计能区分假设的观察。修复: 解释触发条件与失效机制；最小修复后跑相关回归。变式: 单机变多机、读变写；指出原来的假设何处失效</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S8-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">看见症状后，下一步查什么？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 定位</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 固定任务版本并画时间线</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 缺失事件不随意补成成功</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 假设</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 提出可证伪的不同解释</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 设计能区分假设的观察</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 修复</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 解释触发条件与失效机制</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 最小修复后跑相关回归</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 变式</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 单机变多机、读变写</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 指出原来的假设何处失效</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>