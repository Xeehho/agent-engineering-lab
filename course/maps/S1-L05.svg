<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S1-L05 模型基础：Token、上下文与推理边界</title><desc id="diagram-description">单位: Token由对应分词器产生；不能固定按汉字计算。窗口: 输入与预留输出共享预算；限制随模型版本核对。选择: 关键规则、任务和相关证据；持久历史不等于当前上下文。边界: 相似、流畅不证明事实正确；示意计数不代表真实账单</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S1-L05</tspan></text><text x="350" y="305"><tspan x="350" dy="0">这次模型真正看到了什么？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 单位</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• Token由对应分词器产生</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 不能固定按汉字计算</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 窗口</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 输入与预留输出共享预算</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 限制随模型版本核对</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 选择</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 关键规则、任务和相关证据</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 持久历史不等于当前上下文</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 边界</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 相似、流畅不证明事实正确</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 示意计数不代表真实账单</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>