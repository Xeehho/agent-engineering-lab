<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S3-L02 MCP 发现、传输与错误</title><desc id="diagram-description">生命周期: 初始化协商修订与能力；发现、调用、关闭各自验证。传输: stdio的stdout只写协议；诊断走stderr或独立日志。错误: 连接或消息失败单独分类；isError表达工具执行错误。恢复: 超时、取消和断开有出口；不能把旧清单当永久可用</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S3-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">连接错误与业务错误怎样区分？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 生命周期</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 初始化协商修订与能力</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 发现、调用、关闭各自验证</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 传输</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• stdio的stdout只写协议</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 诊断走stderr或独立日志</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 错误</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 连接或消息失败单独分类</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• isError表达工具执行错误</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 恢复</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 超时、取消和断开有出口</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 不能把旧清单当永久可用</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>