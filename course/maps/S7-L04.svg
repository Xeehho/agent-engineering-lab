<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S7-L04 真实模型接入与可复现证据</title><desc id="diagram-description">适配: 锁定服务商SDK与模型版本；外部格式转换成内部结果。终态: 完整、拒绝、截断分别处理；200不等于完整业务成功。凭证: 只放服务端且最小授权；网页不内置密钥或真实调用。证据: 脱敏请求、usage、版本和失败；真实接通不等于效果达标</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S7-L04</tspan></text><text x="350" y="305"><tspan x="350" dy="0">真实响应怎样进入应用契约？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 适配</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 锁定服务商SDK与模型版本</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 外部格式转换成内部结果</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 终态</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 完整、拒绝、截断分别处理</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 200不等于完整业务成功</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 凭证</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 只放服务端且最小授权</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 网页不内置密钥或真实调用</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 证据</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 脱敏请求、usage、版本和失败</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 真实接通不等于效果达标</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>