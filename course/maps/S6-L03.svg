<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S6-L03 协作评测：质量、延迟与成本</title><desc id="diagram-description">公平: 相同任务与验收口径；版本和预算控制一致。质量: 失败样本进入总分母；分层看关键错误。开销: 失败费用也计入总成本；端到端延迟区别于分支总和。决策: 预设保留与回退规则；小样本不能宣称总体提升</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S6-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">协作方案收益值得成本吗？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 公平</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 相同任务与验收口径</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 版本和预算控制一致</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 质量</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 失败样本进入总分母</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 分层看关键错误</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 开销</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 失败费用也计入总成本</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 端到端延迟区别于分支总和</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 决策</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 预设保留与回退规则</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 小样本不能宣称总体提升</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>