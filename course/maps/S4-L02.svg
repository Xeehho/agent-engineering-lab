<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S4-L02 队列、重试、租约与幂等</title><desc id="diagram-description">队列: 至少一次意味着可能重复；失败分类再决定是否重试。租约: 领取资格有截止时间；续期失败就停止假定持有。代次: 递增token区分领取世代；存储提交拒绝陈旧token。外部: 拒绝提交撤不回邮件；下游幂等与未知结果要恢复</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S4-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">旧工作者醒来后还能提交吗？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 队列</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 至少一次意味着可能重复</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 失败分类再决定是否重试</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 租约</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 领取资格有截止时间</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 续期失败就停止假定持有</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 代次</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 递增token区分领取世代</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 存储提交拒绝陈旧token</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 外部</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 拒绝提交撤不回邮件</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 下游幂等与未知结果要恢复</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>