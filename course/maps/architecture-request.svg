<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="architecture-request-title architecture-request-description"><title id="architecture-request-title">一次请求：从输入到回答或工具</title><desc id="architecture-request-description">ui → api：提交任务；api → task：合法身份与输入；task → context：开始/恢复一轮；context → model：规则、任务与证据；model → decision：结构化提议；decision → result：final：回答候选；decision → tool-gate：tools：请求工具；tool-gate → approval：写入需具体确认；tool-gate → tool-adapter：只读：允许后执行；approval → tool-adapter：确认且防重复；tool-adapter → business：授权业务调用；business → context：实际结果 → 下一轮；context → retrieval：检索所需资料；retrieval → context：带来源证据；result → events：结果或明确失败；events → ui：按任务编号更新</desc><style>text{font:18px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><defs><marker id="arrow-request" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" style="stroke:#7b9987;fill:#7b9987"/></marker></defs><path marker-end="url(#arrow-request)" d="M290 75 L440 75"/><text x="365" y="69" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">提交任务</tspan></text><path marker-end="url(#arrow-request)" d="M700 75 L850 75"/><text x="775" y="69" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">合法身份与输入</tspan></text><path marker-end="url(#arrow-request)" d="M980 115 L980 155 L160 155 L160 205"/><text x="570" y="147" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="570" dy="0">开始/恢复一轮</tspan></text><path marker-end="url(#arrow-request)" d="M290 245 L440 245"/><text x="365" y="239" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">规则、任务与证据</tspan></text><path marker-end="url(#arrow-request)" d="M700 245 L850 245"/><text x="775" y="239" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">结构化提议</tspan></text><path marker-end="url(#arrow-request)" d="M850 245 L700 415"/><text x="775" y="324" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">final：回答候选</tspan></text><path marker-end="url(#arrow-request)" d="M980 285 L980 375"/><text x="980" y="324" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="980" dy="0">tools：请求工具</tspan></text><path marker-end="url(#arrow-request)" d="M980 455 L980 545"/><text x="980" y="494" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="980" dy="0">写入需具体确认</tspan></text><path marker-end="url(#arrow-request)" d="M850 415 L770 415 L770 665 L570 665 L570 715"/><text x="675" y="657" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="675" dy="0">只读：允许后执行</tspan></text><path marker-end="url(#arrow-request)" d="M850 585 L700 755"/><text x="775" y="664" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">确认且防重复</tspan></text><path marker-end="url(#arrow-request)" d="M700 755 L850 755"/><text x="775" y="749" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">授权业务调用</tspan></text><path marker-end="url(#arrow-request)" d="M1110 755 L1170 755 L1170 825 L10 825 L10 245 L30 245"/><text x="600" y="816" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="600" dy="0">实际结果 → 下一轮</tspan></text><path marker-end="url(#arrow-request)" d="M90 285 L90 375"/><text x="90" y="319" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="90" dy="0">检索所需资料</tspan></text><path marker-end="url(#arrow-request)" d="M270 375 L270 285"/><text x="285" y="346" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="285" dy="0">带来源证据</tspan></text><path marker-end="url(#arrow-request)" d="M570 455 L570 545"/><text x="570" y="494" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="570" dy="0">结果或明确失败</tspan></text><path marker-end="url(#arrow-request)" d="M440 585 L5 585 L5 75 L30 75"/><text x="210" y="575" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="210" dy="0">按任务编号更新</tspan></text><g data-graph-node="ui"><rect x="30" y="35" width="260" height="80"/><text x="45" y="67"><tspan x="45" dy="0">用户界面</tspan></text></g><g data-graph-node="api"><rect x="440" y="35" width="260" height="80"/><text x="455" y="67"><tspan x="455" dy="0">入口与可信身份</tspan></text></g><g data-graph-node="task"><rect x="850" y="35" width="260" height="80"/><text x="865" y="67"><tspan x="865" dy="0">持久任务与预算</tspan></text></g><g data-graph-node="context"><rect x="30" y="205" width="260" height="80"/><text x="45" y="237"><tspan x="45" dy="0">上下文组装</tspan></text></g><g data-graph-node="model"><rect x="440" y="205" width="260" height="80"/><text x="455" y="237"><tspan x="455" dy="0">模型适配器</tspan></text></g><g data-graph-node="decision"><rect x="850" y="205" width="260" height="80"/><text x="865" y="237"><tspan x="865" dy="0">行动提议分流</tspan></text></g><g data-graph-node="retrieval"><rect x="30" y="375" width="260" height="80"/><text x="45" y="407"><tspan x="45" dy="0">有权限的检索与重排</tspan></text></g><g data-graph-node="result"><rect x="440" y="375" width="260" height="80"/><text x="455" y="407"><tspan x="455" dy="0">结果与证据校验</tspan></text></g><g data-graph-node="tool-gate"><rect x="850" y="375" width="260" height="80"/><text x="865" y="407"><tspan x="865" dy="0">工具执行前检查</tspan></text></g><g data-graph-node="events"><rect x="440" y="545" width="260" height="80"/><text x="455" y="577"><tspan x="455" dy="0">事件与结果投递</tspan></text></g><g data-graph-node="approval"><rect x="850" y="545" width="260" height="80"/><text x="865" y="577"><tspan x="865" dy="0">确认与幂等意图</tspan></text></g><g data-graph-node="tool-adapter"><rect x="440" y="715" width="260" height="80"/><text x="455" y="747"><tspan x="455" dy="0">业务或MCP适配器</tspan></text></g><g data-graph-node="business"><rect x="850" y="715" width="260" height="80"/><text x="865" y="747"><tspan x="865" dy="0">业务系统与回执</tspan></text></g><text x="30" y="848" style="font-size:12px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>