<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S2-L04 Prompt 与上下文工程</title><desc id="diagram-description">来源: 可信规则与外部资料分开；标注资料来源和版本。预算: 选择相关内容再发送；摘要、历史、缓存都有边界。注入: 资料可能伪装成操作命令；分隔符不是权限防线。迭代: Prompt和样例版本化；同集评测而不是只看措辞</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S2-L04</tspan></text><text x="350" y="305"><tspan x="350" dy="0">规则、任务、资料各能决定什么？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 来源</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 可信规则与外部资料分开</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 标注资料来源和版本</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 预算</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 选择相关内容再发送</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 摘要、历史、缓存都有边界</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 注入</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 资料可能伪装成操作命令</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 分隔符不是权限防线</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 迭代</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• Prompt和样例版本化</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 同集评测而不是只看措辞</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>