<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S3-L03 MCP 权限与服务信任</title><desc id="diagram-description">身份: 认证取得可信调用者；不相信模型参数中的tenant。授权: 按身份与资源归属检查；执行时重新校验权限。信任: 检查服务来源与工具行为；凭证受众与作用域收窄。验证: 跨租户与撤权必须拒绝；发现清单过滤不够</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S3-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">谁有权读哪一家公司的工单？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 身份</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 认证取得可信调用者</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 不相信模型参数中的tenant</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 授权</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 按身份与资源归属检查</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 执行时重新校验权限</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 信任</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 检查服务来源与工具行为</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 凭证受众与作用域收窄</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 验证</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 跨租户与撤权必须拒绝</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 发现清单过滤不够</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>