<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S7-L03 部署、限流、降级与运维</title><desc id="diagram-description">容量: 并发、速率、队列分别限制；多实例配额需统一协调。恢复: 退避、熔断和明确降级；未知写入先核对回执。发布: 配置、迁移、健康与灰度；回滚应用不等于撤销数据。观测: 错误率与长尾等待有告警；用演练证明恢复路径</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S7-L03</tspan></text><text x="350" y="305"><tspan x="350" dy="0">忙碌、故障和发布失败时怎么办？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 容量</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 并发、速率、队列分别限制</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 多实例配额需统一协调</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 恢复</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 退避、熔断和明确降级</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 未知写入先核对回执</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 发布</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 配置、迁移、健康与灰度</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 回滚应用不等于撤销数据</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 观测</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 错误率与长尾等待有告警</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 用演练证明恢复路径</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>