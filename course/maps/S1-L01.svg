<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S1-L01 一次模型请求怎样才算成功</title><desc id="diagram-description">调用层: 收到响应并检查完成原因；HTTP成功不等于内容正确。数据层: 先解析JSON，再查字段类型；字符串、对象与业务结果分开。业务层: 分组必须存在并符合工单；结构通过仍需效果评测。验证层: 构造每层都会失败的例子；记录输入、预期、实际与边界</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S1-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">收到返回，为什么还不算成功？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 调用层</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 收到响应并检查完成原因</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• HTTP成功不等于内容正确</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 数据层</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 先解析JSON，再查字段类型</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 字符串、对象与业务结果分开</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 业务层</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 分组必须存在并符合工单</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 结构通过仍需效果评测</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 验证层</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 构造每层都会失败的例子</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 记录输入、预期、实际与边界</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>