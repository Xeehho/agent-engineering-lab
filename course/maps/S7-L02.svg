<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S7-L02 Trace、日志与费用观测</title><desc id="diagram-description">关联: trace串请求、span记操作；传播任务与尝试编号。信号: 日志看事件、指标看趋势；耗时区间先闭合再计算。成本: usage缺失保留未知；计费按服务与日期核对。隐私: 脱敏仍保留排错关联；避免完整用户内容与密钥</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S7-L02</tspan></text><text x="350" y="305"><tspan x="350" dy="0">一次任务怎样穿过所有组件日志？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 关联</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• trace串请求、span记操作</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 传播任务与尝试编号</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 信号</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 日志看事件、指标看趋势</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 耗时区间先闭合再计算</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 成本</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• usage缺失保留未知</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 计费按服务与日期核对</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 隐私</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 脱敏仍保留排错关联</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 避免完整用户内容与密钥</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>