<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="architecture-quality-title architecture-quality-description"><title id="architecture-quality-title">质量闭环：评测、发布、观测、改进</title><desc id="architecture-quality-description">dataset → eval：固定样本与评分器；eval → release：关键门槛全部满足；release → observe：版本化运行；observe → incident：脱敏故障证据；incident → task：受控恢复或回放；incident → dataset：经核验失败回归；task → eval：修复后重新验证</desc><style>text{font:18px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><defs><marker id="arrow-quality" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" style="stroke:#7b9987;fill:#7b9987"/></marker></defs><path marker-end="url(#arrow-quality)" d="M290 75 L440 75"/><text x="365" y="69" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">固定样本与评分器</tspan></text><path marker-end="url(#arrow-quality)" d="M700 75 L850 75"/><text x="775" y="69" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">关键门槛全部满足</tspan></text><path marker-end="url(#arrow-quality)" d="M980 115 L980 255"/><text x="980" y="179" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="980" dy="0">版本化运行</tspan></text><path marker-end="url(#arrow-quality)" d="M850 295 L700 295"/><text x="775" y="289" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="775" dy="0">脱敏故障证据</tspan></text><path marker-end="url(#arrow-quality)" d="M440 295 L290 295"/><text x="365" y="289" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">受控恢复或回放</tspan></text><path marker-end="url(#arrow-quality)" d="M440 295 L290 75"/><text x="365" y="179" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">经核验失败回归</tspan></text><path marker-end="url(#arrow-quality)" d="M290 295 L440 75"/><text x="365" y="179" text-anchor="middle" style="font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round"><tspan x="365" dy="0">修复后重新验证</tspan></text><g data-graph-node="dataset"><rect x="30" y="35" width="260" height="80"/><text x="45" y="67"><tspan x="45" dy="0">固定分层评测集</tspan></text></g><g data-graph-node="eval"><rect x="440" y="35" width="260" height="80"/><text x="455" y="67"><tspan x="455" dy="0">分层评测与校准</tspan></text></g><g data-graph-node="release"><rect x="850" y="35" width="260" height="80"/><text x="865" y="67"><tspan x="865" dy="0">门槛、发布与回滚</tspan></text></g><g data-graph-node="observe"><rect x="850" y="255" width="260" height="80"/><text x="865" y="287"><tspan x="865" dy="0">运行观测与脱敏追踪</tspan></text></g><g data-graph-node="incident"><rect x="440" y="255" width="260" height="80"/><text x="455" y="287"><tspan x="455" dy="0">故障定位与受控恢复</tspan></text></g><g data-graph-node="task"><rect x="30" y="255" width="260" height="80"/><text x="45" y="287"><tspan x="45" dy="0">持久任务与预算</tspan></text></g><text x="30" y="388" style="font-size:12px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>