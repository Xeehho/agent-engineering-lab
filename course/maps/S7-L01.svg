<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S7-L01 评测集、评分器与回归门槛</title><desc id="diagram-description">数据: 固定输入和期望依据；隔离开发与测试样本。评分: 规则、人工、模型各有边界；校准裁判并保留版本。门槛: 通过率和关键错误同时看；越权不能由平均分抵消。复现: 记录模型Prompt工具数据版本；失败样本回归但防止泄题</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S7-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">哪个失败必须挡住发布？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 数据</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 固定输入和期望依据</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 隔离开发与测试样本</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 评分</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 规则、人工、模型各有边界</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 校准裁判并保留版本</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 门槛</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 通过率和关键错误同时看</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 越权不能由平均分抵消</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 复现</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• 记录模型Prompt工具数据版本</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 失败样本回归但防止泄题</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0 · creativecommons.org/licenses/by/4.0/</text></svg>