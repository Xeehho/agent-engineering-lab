<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">S5-L01 RAG 数据入口：切分、版本与权限</title><desc id="diagram-description">入库: 采集、清理、解析、切分；保留标题与条件完整性。血缘: 片段指回原文和版本；标注租户、权限与有效性。删除: 旧版本、索引、缓存同步失效；重建期间选择明确版本。边界: RAG不等于修改模型权重；暴露资料前就检查权限</desc><style>text{font:15px system-ui,sans-serif;fill:#203e35}.root text{font-weight:700}.branch text{font-size:14px}path{fill:none;stroke:#91ac9d;stroke-width:2}rect{fill:#f2f7f2;stroke:#c9d9cd;rx:12}.root rect{fill:#dcebdc;stroke:#51836a}.active rect{fill:#d6eecb;stroke:#1e6549;stroke-width:3}</style><rect width="100%" height="100%" fill="#fff" style="fill:#fff;stroke:none;rx:0"/><path d="M500 300 Q350 180 220 125"/><path d="M500 300 Q650 180 780 125"/><path d="M500 300 Q350 420 220 445"/><path d="M500 300 Q650 420 780 445"/><g class="root"><rect x="330" y="245" width="340" height="105"/><text x="350" y="276"><tspan x="350" dy="0">S5-L01</tspan></text><text x="350" y="305"><tspan x="350" dy="0">每段知识来自哪一版、谁能看？</tspan></text></g><g class="branch"><rect x="25" y="35" width="390" height="175"/><text x="43" y="64"><tspan x="43" dy="0">1. 入库</tspan></text><text x="43" y="100"><tspan x="43" dy="0">• 采集、清理、解析、切分</tspan></text><text x="43" y="148"><tspan x="43" dy="0">• 保留标题与条件完整性</tspan></text></g><g class="branch"><rect x="585" y="35" width="390" height="175"/><text x="603" y="64"><tspan x="603" dy="0">2. 血缘</tspan></text><text x="603" y="100"><tspan x="603" dy="0">• 片段指回原文和版本</tspan></text><text x="603" y="148"><tspan x="603" dy="0">• 标注租户、权限与有效性</tspan></text></g><g class="branch"><rect x="25" y="355" width="390" height="175"/><text x="43" y="384"><tspan x="43" dy="0">3. 删除</tspan></text><text x="43" y="420"><tspan x="43" dy="0">• 旧版本、索引、缓存同步失效</tspan></text><text x="43" y="468"><tspan x="43" dy="0">• 重建期间选择明确版本</tspan></text></g><g class="branch"><rect x="585" y="355" width="390" height="175"/><text x="603" y="384"><tspan x="603" dy="0">4. 边界</tspan></text><text x="603" y="420"><tspan x="603" dy="0">• RAG不等于修改模型权重</tspan></text><text x="603" y="468"><tspan x="603" dy="0">• 暴露资料前就检查权限</tspan></text></g><text x="25" y="587" style="font-size:11px">Agent Engineering Lab · Xeehho · CC BY 4.0</text></svg>